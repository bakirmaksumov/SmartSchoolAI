name: Docker CI

# Builds the container and proves it works the way it will be deployed. It does not publish
# the image or deploy anywhere.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: smoke
      # No real keys here: OpenRouter and reCAPTCHA stay disabled, as in E2E_AI=0.
      OPENROUTER_API_KEY: ""
      RECAPTCHA_SITE_KEY: ""
      RECAPTCHA_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker compose build

      - name: Start the container (fresh volumes)
        run: docker compose up -d

      - name: Container runs as an unprivileged user
        run: |
          uid="$(docker compose exec -T web id -u)"
          echo "container uid: $uid"
          test "$uid" != "0"

      - name: Smoke test, recreate the container, check data survived
        env:
          BASE_URL: http://localhost:8080
          RECREATE_CMD: docker compose down && docker compose up -d
        run: scripts/ci/docker-smoke.sh

      - name: Container healthcheck reports healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q web)")"
            echo "health: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=200 web

      # Removes the container, network and both volumes, so nothing outlives the run.
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
